      { src: "img/fix/46.webp", alt: "翻修紀錄 46｜木作收尾", stage: "木作收尾" },
      { src: "img/fix/47.webp", alt: "翻修紀錄 47｜完工紀錄", stage: "完工紀錄" },
      { src: "img/fix/48.webp", alt: "翻修紀錄 48｜完工紀錄", stage: "完工紀錄" },
      { src: "img/fix/49.webp", alt: "翻修紀錄 49｜完工紀錄", stage: "完工紀錄" },
      { src: "img/fix/50.webp", alt: "翻修紀錄 50｜完工紀錄", stage: "完工紀錄" },
      { src: "img/fix/51.webp", alt: "翻修紀錄 51｜完工紀錄", stage: "完工紀錄" },
      { src: "img/fix/52.webp", alt: "翻修紀錄 52｜完工紀錄", stage: "完工紀錄" },
      { src: "img/fix/53.webp", alt: "翻修紀錄 53｜完工紀錄", stage: "完工紀錄" }
    ];

    const photoWall = document.getElementById("renovation-photo-wall");
    const openGalleryButton = document.getElementById("open-renovation-gallery");
    const lightbox = document.getElementById("gallery-lightbox");
    const lightboxTitle = document.getElementById("lightbox-title");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const lightboxClose = document.getElementById("lightbox-close");
    const lightboxPrevious = document.getElementById("lightbox-previous");
    const lightboxNext = document.getElementById("lightbox-next");
    let activeGalleryIndex = 0;
    let previouslyFocusedElement = null;

    const formatGalleryIndex = (index) => String(index + 1).padStart(2, "0");
    const getGalleryPosition = (index) => (index + renovationImages.length) % renovationImages.length;

    const photoWallImageIndexes = [
      [0, 3, 6, 9, 12, 15],
      [1, 4, 7, 10, 13, 16],
      [2, 5, 8, 11, 14, 17]
    ];

    const createPhotoWallGroup = (imageIndexes) => {
      const group = document.createElement("div");
      group.className = "photo-wall-group";

      imageIndexes.forEach((imageIndex) => {
        const image = renovationImages[imageIndex];
        const item = document.createElement("div");
        const imageElement = document.createElement("img");

        item.className = "photo-wall-item";
        imageElement.src = image.src;
        imageElement.alt = "";
        imageElement.decoding = "async";
        item.append(imageElement);
        group.append(item);
      });

      return group;
    };

    photoWall.querySelectorAll(".photo-wall-track").forEach((track, trackIndex) => {
      const firstGroup = createPhotoWallGroup(photoWallImageIndexes[trackIndex]);
      const secondGroup = firstGroup.cloneNode(true);
      track.append(firstGroup, secondGroup);
    });

    const setGalleryImage = (index) => {
      activeGalleryIndex = getGalleryPosition(index);
      const image = renovationImages[activeGalleryIndex];
      const positionLabel = `${formatGalleryIndex(activeGalleryIndex)} / ${formatGalleryIndex(renovationImages.length - 1)}`;

      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightboxTitle.textContent = "裝修紀錄";
      lightboxCaption.textContent = image.alt;
      lightboxCounter.textContent = positionLabel;
    };

    const openLightbox = (index) => {
      previouslyFocusedElement = document.activeElement;
      setGalleryImage(index);
      lightbox.hidden = false;
      document.body.classList.add("gallery-open");
      lightboxClose.focus();
    };

    const closeLightbox = () => {
      lightbox.hidden = true;
      document.body.classList.remove("gallery-open");
      if (previouslyFocusedElement instanceof HTMLElement) previouslyFocusedElement.focus();
    };

    openGalleryButton.addEventListener("click", () => openLightbox(0));
    lightboxClose.addEventListener("click", closeLightbox);
    lightboxPrevious.addEventListener("click", () => setGalleryImage(activeGalleryIndex - 1));
    lightboxNext.addEventListener("click", () => setGalleryImage(activeGalleryIndex + 1));
    lightbox.querySelector("[data-lightbox-close]").addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (event) => {
      if (lightbox.hidden) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") setGalleryImage(activeGalleryIndex - 1);
      if (event.key === "ArrowRight") setGalleryImage(activeGalleryIndex + 1);
    });
  </script>
